# Run Code Sentinel automated code review on every pull request.
#
# ---------------------------------------------------------------------------
# Test repo setup (repository secrets)
# ---------------------------------------------------------------------------
# 1. Deploy the Code Sentinel API (see serving/deploy_api.py) or run locally
#    with ngrok/cloudflared exposing port 8080.
# 2. In your GitHub repository, open Settings → Secrets and variables → Actions.
# 3. Click "New repository secret".
# 4. Name:  CODE_SENTINEL_API_URL
#    Value: Base URL of the running API, without a trailing slash.
#           Examples:
#             https://your-vertex-endpoint.us-central1-123456.prediction.vertexai.goog/v1/projects/.../endpoints/.../deployedModels/...
#             https://abc123.ngrok-free.app
# 5. Name:  GCP_SERVICE_ACCOUNT_KEY
#    Value: JSON service account key with Vertex AI predict access.
# 6. GITHUB_TOKEN is provided automatically — no secret needed.
#    This workflow requests pull-requests: write so the bot can post comments.
# 7. Open a test PR; the workflow posts a "Code Sentinel Review" comment.

name: Code Sentinel PR Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Code Sentinel Review
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests google-auth

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Run Code Sentinel PR review
        env:
          CODE_SENTINEL_API_URL: ${{ secrets.CODE_SENTINEL_API_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python github_action/review_pr.py
